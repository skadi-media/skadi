name: CI

on:
  push:
    branches: [main]
    # Tags too (SKADI-T-0482): images and releases are cut from them, and until
    # now nothing tested a tag before it was published.
    tags: ["v*"]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # The web crate is built for wasm; the lint below needs the target.
      - name: Add the wasm target
        run: rustup target add wasm32-unknown-unknown

      - name: Format check
        run: cargo fmt --check

      # `cargo fmt --check` stops at the workspace; the two excluded crates
      # need naming (SKADI-T-0640).
      - name: Format check (web and worker, outside the workspace)
        run: >-
          cargo fmt --check --manifest-path crates/skadi-web/Cargo.toml &&
          cargo fmt --check --manifest-path crates/skadi-downloader-worker/Cargo.toml

      # --all-targets so test and bench code is linted too (SKADI-T-0484).
      # Without it the lint gate covered library code only, which is how three
      # separate test-code lint failures (T-0429/0443/0457) survived in-tree
      # long enough to need their own tickets.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The worker lives outside the workspace, so --workspace does not reach it
      # and it was linted by nothing (SKADI-T-0484). It went two tickets without
      # compiling once for the same reason.
      - name: Clippy (worker, outside the workspace)
        run: >-
          cargo clippy --manifest-path crates/skadi-downloader-worker/Cargo.toml
          --all-targets -- -D warnings

      # The web UI is excluded from the workspace for the same reason and was
      # linted by nothing (SKADI-T-0640). It is a wasm crate: lint it as one.
      - name: Clippy (web, outside the workspace)
        run: >-
          cargo clippy --manifest-path crates/skadi-web/Cargo.toml
          --target wasm32-unknown-unknown --all-targets -- -D warnings

      - name: Cargo check
        run: cargo check --workspace

      - name: Cargo check (worker, outside the workspace)
        run: cargo check --manifest-path crates/skadi-downloader-worker/Cargo.toml

  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Run unit tests
        run: cargo test --workspace --lib -- --test-threads=1

      - name: Run unit tests (worker, outside the workspace)
        run: >-
          cargo test --manifest-path crates/skadi-downloader-worker/Cargo.toml
          --lib -- --test-threads=1

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Run integration tests
        run: cargo test --workspace --test integration -- --test-threads=1

      - name: Run integration tests (worker, outside the workspace)
        run: >-
          cargo test --manifest-path crates/skadi-downloader-worker/Cargo.toml
          --test integration -- --test-threads=1

  test-store-dual-backend:
    name: Store (SQLite + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: skadi
          POSTGRES_PASSWORD: skadi
          POSTGRES_DB: skadi
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U skadi -d skadi"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      # Exercise the Postgres backend in skadi-store's cross-backend harness.
      SKADI_TEST_DATABASE_URL: postgres://skadi:skadi@127.0.0.1:5432/skadi
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      # Named targets, not a bare `cargo test -p`: that also runs the `bdd`
      # target, which is `harness = false` — a cucumber main that rejects
      # `--test-threads` outright ("unexpected argument"). The BDD job already
      # covers it via `cargo test --workspace --test bdd`, so running it here
      # was duplicated work that happened to fail (2026-09-23).
      #
      # `--test-threads=1` stays for the rest: these tests share one database.
      - name: Run skadi-store tests against both backends
        run: cargo test -p skadi-store --lib --test cross_backend -- --test-threads=1

  test-bdd:
    name: BDD (cucumber, @gap/@lab excluded)
    runs-on: ubuntu-latest
    # A hung scenario once held a release for over two hours (SKADI-T-0669);
    # GitHub's default is six. About 3x the normal maximum for each job.
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@v4

      # This job builds TWO full debug trees: the workspace, then the worker,
      # which is in the workspace `exclude` list and so has its own `target/`
      # and rebuilds librqbit plus a from-source jemalloc. Together they do not
      # fit a stock runner — 0.1.1 was blocked twice by
      # `ar: ... No space left on device` surfacing as a tikv-jemalloc-sys
      # build-script panic (SKADI-T-0643). Reclaiming the preinstalled
      # toolchains nothing here uses buys ~30 GB, which is more headroom than
      # both builds need. NOT `cargo clean` between the steps: that fixes the
      # disk by defeating rust-cache and makes every BDD run a cold build.
      - name: Free disk (preinstalled toolchains this repo does not use)
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL
          df -h / | tail -1

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Workspace BDD suites
        run: cargo test --workspace --test bdd

      # `df` after each build so a future disk failure reads as a disk failure
      # instead of as a jemalloc build-script backtrace three screens down.
      - name: Disk after the workspace build
        run: df -h /

      - name: Worker BDD suite
        run: cargo test --manifest-path crates/skadi-downloader-worker/Cargo.toml --test bdd

      - name: Disk after the worker build
        if: always()
        run: df -h /

  compose-config:
    name: Compose renders (base, +lab)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # No `needs: check` — this validates YAML and env interpolation, not Rust, so
    # it should still report when the code does not compile. That is exactly when
    # a deploy-time-only failure is most expensive to discover.
    steps:
      - uses: actions/checkout@v4

      - name: Render every compose combination with placeholder env
        run: deploy/compose-check.sh

  test-functional:
    name: Functional Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Run functional tests
        run: cargo test --workspace --test functional -- --test-threads=1

      - name: Run ignored tests (external services)
        run: cargo test --workspace --test functional -- --test-threads=1 --ignored
        continue-on-error: true

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Coverage is a report, not a gate (SKADI-T-0644, 2026-09-25). Nothing
    # depends on it: `images` deliberately omits it from its `needs:`, so the
    # run's conclusion reports the tests and red means something.
    # `continue-on-error` stays for that reason, not because the job is broken.
    #
    # It was broken until SKADI-T-0732: `-- --test-threads=1` reaches every
    # test binary, and the cucumber `bdd` targets (`harness = false`) reject
    # the flag with "unexpected argument", so cargo stopped at the first of
    # them and no report was made. RUST_TEST_THREADS=1 limits libtest the same
    # way, and the other harnesses ignore it.
    continue-on-error: true
    needs:
      [
        test-unit,
        test-integration,
        test-store-dual-backend,
        test-bdd,
        test-functional,
      ]
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Generate coverage
        env:
          RUST_TEST_THREADS: "1"
        run: |
          cargo llvm-cov --workspace --no-report
          cargo llvm-cov report --workspace --html --output-dir coverage/
          cargo llvm-cov report --workspace --lcov --output-path coverage/lcov.info
          cargo llvm-cov report --workspace

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  build:
    name: Build (release)
    # Linux only. skadi ships as a container and runs on Linux; the macOS job
    # existed to catch portability breaks and instead failed at the linker,
    # unable to find `libpq` on the runner. That is an environment gap, not a
    # code defect, and paying for a Homebrew install on every push to guard a
    # platform nothing deploys to is the wrong trade (2026-09-23). Development
    # on macOS is still covered by `cargo check` locally.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

  role-sweep:
    name: Per-role UI sweep
    # The UI must never offer a role what the API refuses (SKADI-T-0639). A
    # release gate (Dylan, 2026-10-17): `images` and `release` need it, and
    # locally `angreal version bump` runs it first. The sweep is
    # web-e2e/tests/roles.spec.ts against the mock-provider harness.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ARG TRUNK_VERSION=//p' Dockerfile)"
          test -n "$version"
          url="https://github.com/trunk-rs/trunk/releases/download/v${version}/trunk-x86_64-unknown-linux-gnu.tar.gz"
          curl -fsSL "$url" | tar -xz -C /usr/local/bin trunk

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install the browser
        working-directory: web-e2e
        run: npm ci && npx playwright install --with-deps chromium

      - name: Run the sweep
        working-directory: web-e2e
        run: npx playwright test tests/roles.spec.ts

  android-apk:
    name: Android APK (signed)
    # The release's app (SKADI-T-0637). Behind the same gate as `images` and
    # `release`, which both wait for it: the daemon image carries the APK, and
    # the GitHub release attaches it. It runs on every push so that a skipped
    # job cannot skip those two; its steps act only on a v* tag.
    needs:
      [
        check,
        test-unit,
        test-integration,
        test-store-dual-backend,
        test-bdd,
        test-functional,
        compose-config,
        build,
        role-sweep,
      ]
    if: github.event_name == 'push' || github.head_ref == 'ci-android-apk'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TAGGED: ${{ startsWith(github.ref, 'refs/tags/v') || github.head_ref == 'ci-android-apk' }}
    steps:
      - uses: actions/checkout@v4
        if: env.TAGGED == 'true'

      - name: Signing config from the repository secrets
        id: sign
        if: env.TAGGED == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.SKADI_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.SKADI_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SKADI_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SKADI_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$KEYSTORE_B64" ] || [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::warning::no Android signing secrets: the release ships no APK"
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          app=clients/skadi-android
          mkdir -p "$app/keystore"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$app/keystore/skadi-release.jks"
          umask 077
          {
            echo "storeFile=keystore/skadi-release.jks"
            echo "storePassword=$STORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > "$app/keystore.properties"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        if: steps.sign.outputs.ready == 'true'
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        if: steps.sign.outputs.ready == 'true'

      - name: Build the signed APK
        if: steps.sign.outputs.ready == 'true'
        working-directory: clients/skadi-android
        run: ./gradlew --no-daemon -q assembleRelease

      # The same two files deploy/publish-apk.sh writes: skadi-<versionCode>.apk
      # and manifest.json.
      - name: Package the APK and its manifest
        if: steps.sign.outputs.ready == 'true'
        run: |
          set -euo pipefail
          out=clients/skadi-android/app/build/outputs/apk/release
          test -f "$out/app-release.apk" || { echo "::error::no signed APK (app-release.apk) was built"; exit 1; }
          name=$(sed -n 's/.*"versionName": *"\([^"]*\)".*/\1/p' "$out/output-metadata.json" | head -1)
          code=$(sed -n 's/.*"versionCode": *\([0-9]*\).*/\1/p' "$out/output-metadata.json" | head -1)
          test -n "$code"
          mkdir -p apk-dist
          cp "$out/app-release.apk" "apk-dist/skadi-$code.apk"
          printf '{"file":"skadi-%s.apk","version_name":"%s","version_code":%s}\n' "$code" "$name" "$code" > apk-dist/manifest.json
          cat apk-dist/manifest.json

      - uses: actions/upload-artifact@v4
        if: steps.sign.outputs.ready == 'true'
        with:
          name: android-apk
          path: |
            apk-dist/*.apk
            apk-dist/manifest.json
          if-no-files-found: error

  images:
    name: Images (GHCR)
    # A real `needs:` on the whole suite, which is only possible because
    # images.yml is a reusable workflow called from here (SKADI-T-0482).
    # Publishing an image that has not passed the tests is how a broken `latest`
    # reaches the machine that serves the library.
    needs:
      [
        check,
        test-unit,
        test-integration,
        test-store-dual-backend,
        test-bdd,
        test-functional,
        compose-config,
        build,
        role-sweep,
        android-apk,
      ]
    # Never on pull_request: a fork PR cannot be allowed to publish, and an
    # in-repo PR publishing `sha-` tags for unmerged work clutters the registry.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    uses: ./.github/workflows/images.yml
    permissions:
      contents: read
      packages: write
    secrets: inherit

  release:
    name: Release (binaries)
    # The same gate as `images` (SKADI-T-0636). release.yml used to fire on the
    # tag by itself, so a tag at a commit with a failing test published
    # tarballs and no images: a release with binaries and no matching
    # containers. Now a tag publishes binaries only after this run is green.
    needs:
      [
        check,
        test-unit,
        test-integration,
        test-store-dual-backend,
        test-bdd,
        test-functional,
        compose-config,
        build,
        role-sweep,
        android-apk,
      ]
    # Tags only, and never on pull_request: a fork PR must not cut a release.
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/release.yml
    # `contents: write` for this job alone. A called workflow cannot exceed its
    # caller's token, and widening the whole file would hand write access to
    # every test job.
    permissions:
      contents: write
    secrets: inherit
