# Temporary (SKADI-T-0747): find where the skadi-http BDD hangs on the runner.
# Runs the suite many times; a run that passes 60 s gets every thread's
# backtrace from gdb, then is killed. Removed once the cause is fixed.
name: diag-http-bdd

on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/diag-http-bdd.yml"]

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"
      - uses: Swatinem/rust-cache@v2
      - name: Install gdb
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: Build the skadi-http BDD binary
        run: cargo test -p skadi-http --test bdd --no-run
      - name: Run it 60 times, dump stacks on a hang
        working-directory: crates/skadi-http
        run: |
          BIN=$(ls -t ../../target/debug/deps/bdd-* | grep -v '\.d$' | head -1)
          echo "binary: $BIN"
          hangs=0
          for i in $(seq 1 60); do
            "$BIN" > "/tmp/run-$i.log" 2>&1 &
            pid=$!
            waited=0
            while kill -0 "$pid" 2>/dev/null && [ "$waited" -lt 60 ]; do
              sleep 1; waited=$((waited + 1))
            done
            if kill -0 "$pid" 2>/dev/null; then
              hangs=$((hangs + 1))
              echo "::group::run $i HUNG after 60 s — last output"
              tail -40 "/tmp/run-$i.log"
              echo "::endgroup::"
              echo "::group::run $i thread backtraces"
              sudo gdb -p "$pid" -batch -ex "set pagination off" -ex "thread apply all bt" 2>&1 | head -2000
              echo "::endgroup::"
              kill -9 "$pid"
              [ "$hangs" -ge 2 ] && break
            else
              wait "$pid"; rc=$?
              echo "run $i rc=$rc ${waited}s $(grep -E '^[0-9]+ scenarios' /tmp/run-$i.log)"
            fi
          done
          echo "hangs: $hangs"
