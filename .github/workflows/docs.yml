name: Docs

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'plissken.toml'
      - 'crates/*/src/**'
      - 'bindings/*/python/**'
      - 'bindings/*/src/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust 1.93
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.93"

      - uses: Swatinem/rust-cache@v2

      - name: Install plissken
        run: cargo install plissken

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install mkdocs-material
        run: pip install mkdocs-material

      - name: Generate API docs
        run: plissken render

      - name: Build site
        run: mkdocs build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    # GitHub Pages is not available for a **private** repository on a Free
    # plan, and this org is Free while the repo is private — the deploy step
    # answers `404 … Ensure GitHub Pages has been enabled` and the whole
    # workflow goes red on every push (SKADI-T-0482, 2026-09-23).
    #
    # The docs still *build* above, which is the part that catches a broken
    # mkdocs config or a dead link. Only the publish is skipped, and only
    # while private: the moment the repo goes public this starts deploying on
    # its own with no edit needed. A workflow that is permanently red is a
    # workflow people stop reading.
    if: github.event.repository.visibility == 'public'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
