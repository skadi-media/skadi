# Container images for the deploy stack (SKADI-I-0056, SKADI-T-0482).
#
# Builds the `skadi` daemon and `skadi-downloader-worker` images for linux/amd64
# and linux/arm64 and publishes them to GHCR so the NAS (Synology DS1821+, 4 GB —
# it cannot build a Rust workspace) just pulls:
#
#   ghcr.io/skadi-media/skadi:latest                  ghcr.io/skadi-media/skadi:sha-<short>
#   ghcr.io/skadi-media/skadi-downloader-worker:...   (+ vX.Y.Z on release tags)
#
# `latest` tracks main. deploy/docker-compose.nas.yml consumes these; a plain
# `docker compose pull && up -d` (or Container Manager's project update) on the
# NAS rolls a new build out. The repo and both packages are public, so a pull
# needs no credentials at all — verified anonymously against the GHCR token
# endpoint. (A bare manifest GET returns 401 even for a public image, which
# is what made this look like an auth problem; fetch a token first.)
#
# **Called from ci.yml, not triggered directly** (SKADI-T-0482). Publishing an
# image that has not passed the test suite is how a broken `latest` reaches the
# machine that serves the library, and cross-workflow `needs:` does not exist —
# so this is a reusable workflow and ci.yml gates it with a real `needs:` on
# every test job. `workflow_dispatch` stays for republishing by hand.
name: Images

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        image: [skadi, skadi-downloader-worker]
        # `arch` must be a real matrix dimension. Listing the two
        # architectures under `include:` alone does NOT make a cross product —
        # include *merges into* existing combinations, so both jobs took the
        # last matching entry and the workflow silently built **arm64 twice
        # and amd64 never** (first real run, 2026-09-24). The manifest job then
        # failed for want of an amd64 digest, which is the only reason anyone
        # noticed.
        arch: [amd64, arm64]
        # Native runners per architecture rather than one QEMU build
        # (SKADI-T-0482). Emulating arm64 to compile a Rust workspace takes
        # hours — the Mac measured 11 minutes for the *worker* alone under
        # Rosetta, and the daemon additionally builds the wasm UI.
        # These includes now only *map* a value onto each combination, which
        # is what include is for.
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
          - image: skadi
            dockerfile: Dockerfile
          - image: skadi-downloader-worker
            dockerfile: deploy/worker.Dockerfile
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Each arch pushes an untagged blob and reports its digest; the merge job
      # below assembles the tagged multi-arch manifest. Tagging here instead
      # would leave the two architectures racing to own the same tag.
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true
          # Layer cache in GHA; the Rust builder stage re-runs on source changes
          # regardless (COPY . . invalidates it), so this mostly saves apt/rustup.
          # Scoped per arch so the two runners do not evict each other.
          cache-from: type=gha,scope=${{ matrix.image }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ matrix.arch }}

      - name: Export the digest
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          test -n "$digest"
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          # Arch first, image last, separated by `--`. With the image name
          # first, `digests-skadi-*` also matched
          # `digests-skadi-downloader-worker-*`, so the `skadi` manifest job
          # collected the worker's digests and tried to build a manifest from
          # a digest that does not exist under that name.
          name: digests--${{ matrix.arch }}--${{ matrix.image }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: ${{ matrix.image }} (manifest)
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        image: [skadi, skadi-downloader-worker]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests--*--${{ matrix.image }}
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Called from ci.yml, so github.ref is the caller's ref — main or the v*
      # tag — which is what these tag rules need.
      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}

      - name: Create the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< '${{ steps.meta.outputs.json }}') \
            $(printf "${image}@sha256:%s " *)

      - name: Verify both architectures are in the manifest
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}"
          tag="$(jq -r '.tags[0]' <<< '${{ steps.meta.outputs.json }}')"
          manifest="$(docker buildx imagetools inspect --raw "$tag")"
          echo "$manifest"
          # A manifest silently missing arm64 is the failure mode this ticket is
          # about: the NAS pull would fall back to emulation or fail outright,
          # long after the workflow reported green.
          jq -e '[.manifests[].platform.architecture] | index("amd64")' <<< "$manifest" > /dev/null
          jq -e '[.manifests[].platform.architecture] | index("arm64")' <<< "$manifest" > /dev/null
          echo "both architectures present in $tag ($image)"
