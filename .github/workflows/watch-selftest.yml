# Temporary (SKADI-T-0747): prove the hang watcher dumps and kills. Removed
# before merge.
name: watch-selftest
on:
  pull_request:
    branches: [main]
    paths: [".github/workflows/watch-selftest.yml"]
jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gdb
      - name: A runner that sleeps past the limit is dumped and killed
        run: |
          mkdir -p /tmp/t/deps && cp /bin/sleep /tmp/t/deps/bdd-fake
          start=$(date +%s)
          LIMIT=5 .github/scripts/bdd-hang-watch.sh /tmp/t/deps/bdd-fake 120 > out.log 2>&1; rc=$?
          took=$(( $(date +%s) - start ))
          cat out.log
          echo "rc=$rc took=${took}s"
          test "$rc" -ne 0
          test "$took" -lt 60
          grep -q "BDD runner hung" out.log
          grep -q "Thread 1" out.log
      - name: A runner that finishes is left alone
        run: |
          LIMIT=5 .github/scripts/bdd-hang-watch.sh /bin/true; echo "rc=$?"
