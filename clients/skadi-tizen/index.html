<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Skadi</title>
  <link rel="stylesheet" href="css/app.css">
  <!-- Samsung's player API. `$WEBAPIS` is resolved by the TV. -->
  <script src="$WEBAPIS/webapis/webapis.js"></script>
</head>
<body>
  <!-- The video plane. The page is drawn over it, and the TV shows it through
       any part of the page that has no background. -->
  <object id="av" type="application/avplayer"></object>

  <div id="screen">
    <div id="setup" class="view">
      <h1><svg viewBox="0 0 24 24"><path d="M12 3 V21 M4.2 7.5 L19.8 16.5 M19.8 7.5 L4.2 16.5"/></svg><span>Skadi</span></h1>
      <div class="field" data-field="server"><label>Server</label><input id="f-server" type="text" placeholder="192.0.2.10:8090"></div>
      <div class="field" data-field="user"><label>Username</label><input id="f-user" type="text"></div>
      <div class="field" data-field="pass"><label>Password</label><input id="f-pass" type="password"></div>
      <div class="field" data-field="go"><span class="btn">Sign in</span></div>
      <p class="hint">Up and Down choose a line. Enter opens the keyboard.</p>
    </div>

    <!-- Home, Movies, TV and Search share the menu on the left. -->
    <div id="shell" class="view">
      <div id="rail"></div>
      <div id="pane-home" class="pane"></div>
      <div id="pane-grid" class="pane">
        <div id="grid-band"></div>
        <div id="grid"></div>
        <div id="letters"></div>
      </div>
      <div id="pane-search" class="pane">
        <div id="search-left">
          <div id="search-text"></div>
          <div id="search-keys"></div>
        </div>
        <div id="search-right">
          <div id="search-head"></div>
          <div id="search-results"></div>
        </div>
      </div>
    </div>

    <div id="detail" class="view">
      <div id="detail-backdrop" class="backdrop"></div>
      <div id="detail-body">
        <img id="detail-poster" alt="">
        <div id="detail-text">
          <h1 id="detail-title"></h1>
          <div id="detail-meta" class="meta"></div>
          <p id="detail-overview"></p>
          <div id="detail-actions"></div>
        </div>
      </div>
    </div>

    <div id="series" class="view">
      <div id="series-backdrop" class="backdrop"></div>
      <img id="series-poster" alt="">
      <div id="series-text">
        <h1 id="series-title"></h1>
        <div id="series-meta" class="meta"></div>
        <p id="series-overview"></p>
        <div id="series-seasons"></div>
        <div id="series-episodes"></div>
      </div>
    </div>

    <div id="player" class="view">
      <div id="player-top"><div id="pt-title"></div><div id="pt-sub"></div></div>
      <div id="player-state"></div>
      <div id="player-bottom">
        <div id="pb-line">
          <span id="pb-cur"></span>
          <div id="pb-track"><div id="pb-fill"></div><div id="pb-knob"></div></div>
          <span id="pb-total"></span>
        </div>
        <div id="pb-opts"></div>
      </div>
    </div>

    <div id="toast"></div>
  </div>

  <script src="js/core.js"></script>
  <!-- Optional, never committed: a developer's own defaults. See the README. -->
  <script src="js/dev.local.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
