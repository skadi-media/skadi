[package]
name = "skadi-tv"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Television domain for Skadi: Series/Season/Episode, metadata, search/match/import, and the DomainModule + HTTP (SKADI-I-0037)"

[dependencies]
skadi-core = { workspace = true }
skadi-library-scan = { workspace = true }
skadi-store = { workspace = true }
skadi-importer = { workspace = true }
skadi-naming = { workspace = true }
skadi-config = { workspace = true }
skadi-metadata = { workspace = true }
skadi-hunter = { workspace = true }
skadi-indexers = { workspace = true }
skadi-downloaders = { workspace = true }
skadi-notify = { workspace = true }
skadi-quality = { workspace = true }
skadi-media-probe = { workspace = true }
futures = { workspace = true }
skadi-api = { workspace = true }
axum = { workspace = true }
async-trait = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
diesel = { workspace = true }
diesel-dualdb = { workspace = true }
diesel_migrations = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
cloacina = { version = "0.11.1", default-features = false, features = ["macros", "postgres", "sqlite"] }
cloacina-workflow = "0.11.1"

[dev-dependencies]
cucumber = { workspace = true }
skadi-testsupport = { workspace = true }
tempfile = "3"
diesel = { workspace = true }
# HTTP-level tests for the manual acquire surface (SKADI-T-0558), mirroring the
# movies harness.
tower = { workspace = true }
http-body-util = "0.1"

[lints.rust]
# cloacina macros (refresh.rs) emit `#[cfg(packaged)]` branches.
unexpected_cfgs = "allow"

# BDD runner (SKADI-I-0057): cucumber needs its own main; features in tests/features.
[[test]]
name = "bdd"
harness = false
