# skadi-web — Leptos CSR front-end for the Skadi daemon (SKADI-I-0010).
#
# This crate is DELIBERATELY excluded from the workspace (see root Cargo.toml):
# it targets wasm32-unknown-unknown and is built by `trunk`, not `cargo`. The
# build output (dist/) is embedded into skadi-api via rust-embed and served at
# `/`.
#
# Build:   trunk build --release      (from this directory)
# Dev:     trunk serve --proxy-backend=http://127.0.0.1:8080/api
[package]
name = "skadi-web"
version = "0.1.9"
edition = "2024"
rust-version = "1.93"
license = "MIT OR Apache-2.0"
authors = ["Dylan Storey"]
description = "Leptos CSR web UI for the Skadi daemon"
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
leptos_router = { version = "0.8" }
gloo-timers = { version = "0.3", features = ["futures"] }
gloo-net = { version = "0.6", features = ["http"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "Window", "Document", "Element", "HtmlElement", "HtmlButtonElement", "HtmlDetailsElement", "Node", "NodeList",
    "Navigator", "Clipboard",
    # Offline audiobook player (SKADI-I-0048): authed XHR download with
    # progress, blob playback, lockscreen MediaSession, localStorage position.
    # (MediaSession itself is driven via js_sys::Reflect — its web-sys types
    # are unstable-gated and not worth threading the cfg through trunk/wasm-pack/Docker.)
    "HtmlAudioElement", "HtmlMediaElement",
    "HtmlVideoElement", "XmlHttpRequest",
    "TextTrack", "TextTrackList", "TextTrackMode",
    "XmlHttpRequestResponseType", "ProgressEvent", "Blob", "Url", "Storage",
    "Event",
    # OPFS offline book storage (SKADI-T-0332).
    "StorageManager", "FileSystemDirectoryHandle", "FileSystemFileHandle",
    "FileSystemWritableFileStream", "FileSystemGetFileOptions",
    "FileSystemGetDirectoryOptions", "File", "WritableStream",
    # Browser uploads (SKADI-T-0631): read a picked file and send it in Blob
    # slices, so only the chunk in flight is ever in memory.
    "HtmlInputElement", "FileList",
    # Live poll (SKADI-T-0693): stop polling while the tab is hidden.
    "AddEventListenerOptions",
    # Library toolbar DOM test (SKADI-T-0695): drive the sort <select>.
    "HtmlSelectElement",
    # In-app confirm dialog (SKADI-T-0694): Esc and the Tab trap; the DOM
    # test builds the key events.
    "KeyboardEvent", "KeyboardEventInit",
    # Provider form DOM test (SKADI-T-0699): a bubbling `input` event.
    "EventInit",
    # Responsive shell DOM test (SKADI-T-0697): where the closed drawer sits.
    "DomRect",
    # Aurora frame (SKADI-T-0717): the skip link finds the AppShell after it.
    "HtmlAnchorElement", "DomTokenList",
    # The scroll-lock DOM test reads the computed overflow.
    "CssStyleDeclaration",
    # Aurora dialogs close on a press that starts on the scrim (SKADI-T-0719):
    # the DOM tests send mousedown, mouseup and click.
    "MouseEvent", "MouseEventInit",
    # Server push (SKADI-T-0711): the event stream is read with fetch() and a
    # ReadableStream reader, which can send the bearer header.
    "ReadableStream", "ReadableStreamDefaultReader", "AbortController", "AbortSignal",
    "TextDecoder", "TextDecodeOptions",
] }
console_error_panic_hook = "0.1"
# Aurora, Colliery's Leptos design system (SKADI-T-0717): tokens, stylesheet,
# frame (AppShell + SideNav) and the light / dark / hyper themes. The library is
# imported as `aurora_leptos`. The stylesheet is linked at build time from the
# files that `aurora-css/` writes (see Trunk.toml).
colliery-io-aurora = "0.6.1"

# A workspace of its own, so the `aurora-css/` helper shares this Cargo.lock and
# so writes the stylesheet of the same Aurora version the app links
# (SKADI-T-0717). `cargo build` here still builds only skadi-web.
[workspace]
members = ["aurora-css"]

[dev-dependencies]
# Web UI test pyramid (SKADI-T-0118/T-0119): run logic + component tests as real
# wasm in a headless browser via `wasm-pack test --headless --chrome`.
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
