<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Skadi</title>
    <meta name="color-scheme" content="light dark" />
    <!-- aurora_leptos::THEME_INIT_SCRIPT, verbatim (SKADI-T-0717; a test in
         tests/logic.rs keeps it equal to the crate's). It sets data-theme
         from the stored choice before the first paint. -->
    <script>(function(){try{var t=localStorage.getItem("aurora-theme");if(t==="light"||t==="dark"||t==="hyper"){var d=document.documentElement;d.setAttribute("data-theme",t);if(t!=="hyper")d.style.colorScheme=t;}}catch(e){}})();</script>
    <link data-trunk rel="rust" data-wasm-opt="z" />
    <!-- Aurora 0.5 (SKADI-T-0717): IBM Plex, the tokens, the components, and
         the opt-in hyper theme. The trunk pre_build hook writes generated/
         (see Trunk.toml); linked here, so there is no first paint without
         style. Skadi's own classes come after, on Aurora's tokens. -->
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link data-trunk rel="css" href="generated/aurora.css" />
    <link data-trunk rel="css" href="generated/hyper.css" />
    <link data-trunk rel="css" href="style.css" />
    <!-- PWA shell (SKADI-T-0333): installable, opens offline after one online
         visit. sw.js caches the app shell; books live in OPFS (T-0332). -->
    <link data-trunk rel="copy-file" href="sw.js" />
    <link data-trunk rel="copy-file" href="manifest.webmanifest" />
    <link data-trunk rel="copy-file" href="icon-192.png" />
    <link data-trunk rel="copy-file" href="icon-512.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="theme-color" content="#0e1116" />
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () =>
          navigator.serviceWorker.register("/sw.js").catch(() => {})
        );
      }
    </script>
  </head>
  <body></body>
</html>
