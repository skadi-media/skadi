# Skadi secrets-from-files overlay (SKADI-T-0702) — OPT-IN.
#
# Without this file the stack reads its secrets from deploy/.env as plain
# environment variables, exactly as before. Those show in `docker inspect` and
# in the environment of every process in the container. With this overlay the
# four secrets come from files under deploy/secrets/ (gitignored), mounted at
# /run/secrets/<name>, and the containers get only the PATH:
#
#   secret file                 read by
#   secrets/postgres_password   postgres (POSTGRES_PASSWORD_FILE), postgres-backup,
#                               skadi + worker (SKADI_DATABASE_PASSWORD_FILE)
#   secrets/skadi_api_token     skadi (SKADI_API_TOKEN_FILE)
#   secrets/skadi_secret_key    skadi (SKADI_SECRET_KEY_FILE)
#   secrets/tailscale_authkey   tailscale (TS_AUTHKEY=file:…), only with the
#                               `tailscale` profile
#
# How it is switched on:
#   - `angreal deploy …` adds this file when the directory deploy/secrets/ exists.
#   - `angreal lab …` adds it when deploy/.lab/secrets/ exists
#     (`angreal lab up --secrets` writes those files from deploy/.env.lab).
#   - plain compose: `docker compose -f docker-compose.yml -f docker-compose.secrets.yml …`
#
# SKADI_SECRETS_DIR moves the directory (default ./secrets, relative to deploy/).
# Migration steps, file permissions and rollback: deploy/README.md, "Secrets
# from files".
#
# The `!reset null` lines REMOVE the plain variables the base file sets, so the
# value is not in the container environment even as an empty string. (The
# daemon and Postgres also refuse X and X_FILE set together.) Needs
# compose >= 2.24, like the lab overlay.

secrets:
  postgres_password:
    file: ${SKADI_SECRETS_DIR:-./secrets}/postgres_password
  skadi_api_token:
    file: ${SKADI_SECRETS_DIR:-./secrets}/skadi_api_token
  skadi_secret_key:
    file: ${SKADI_SECRETS_DIR:-./secrets}/skadi_secret_key
  tailscale_authkey:
    file: ${SKADI_SECRETS_DIR:-./secrets}/tailscale_authkey

services:
  postgres:
    secrets: [postgres_password]
    environment:
      POSTGRES_PASSWORD: !reset null
      # The image's entrypoint reads the file (docker-library convention).
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password

  postgres-backup:
    secrets: [postgres_password]
    environment:
      PGPASSWORD: !reset null
      # Read by the backup loop's entrypoint script (libpq has no _FILE form).
      PGPASSWORD_FILE: /run/secrets/postgres_password

  skadi:
    secrets: [postgres_password, skadi_api_token, skadi_secret_key]
    environment:
      # The URL carries no password; the daemon puts it in from the file.
      SKADI_DATABASE_URL: postgres://${POSTGRES_USER:-skadi}@postgres:5432/${POSTGRES_DB:-skadi}
      SKADI_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      SKADI_API_TOKEN: !reset null
      SKADI_API_TOKEN_FILE: /run/secrets/skadi_api_token
      SKADI_SECRET_KEY: !reset null
      SKADI_SECRET_KEY_FILE: /run/secrets/skadi_secret_key

  skadi-downloader-worker:
    secrets: [postgres_password]
    environment:
      SKADI_DATABASE_URL: postgres://${POSTGRES_USER:-skadi}@${POSTGRES_IP:-172.28.0.5}:5432/${POSTGRES_DB:-skadi}
      SKADI_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password

  tailscale:
    secrets: [tailscale_authkey]
    environment:
      # tailscale reads `file:<path>` itself (checked on v1.102.5).
      TS_AUTHKEY: file:/run/secrets/tailscale_authkey
