# Test/development environments for Skadi.
#
# Skadi ships dual-backend (SQLite + Postgres) from day one. SQLite needs no
# services; this compose file provides the Postgres backend used by the
# cross-backend test harness and for local `skadi run` against Postgres.
#
#   docker compose up -d postgres
#   export SKADI_TEST_DATABASE_URL=postgres://skadi:skadi@127.0.0.1:5433/skadi
#   # ... run tests / `SKADI_DATABASE_URL=$SKADI_TEST_DATABASE_URL skadi run` ...
#   docker compose down -v
services:
  postgres:
    image: postgres:16
    # The integration suite runs many test binaries in parallel, each spawning a
    # daemon with its own store pool *and* a Cloacina runner pool — well past
    # Postgres's default 100-connection cap. Raise it so the test fleet doesn't
    # trip "too many clients already". Test-only; production tunes its own server.
    command: ["postgres", "-c", "max_connections=500"]
    environment:
      POSTGRES_USER: skadi
      POSTGRES_PASSWORD: skadi
      POSTGRES_DB: skadi
    ports:
      # Host 5433 -> container 5432, to avoid clashing with a local Postgres.
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skadi -d skadi"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      # Ephemeral storage: test data never needs to survive a restart.
      - /var/lib/postgresql/data
